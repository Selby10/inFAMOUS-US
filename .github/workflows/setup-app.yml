name: Setup app

on:
  # Every push can supersede a build before it publishes to the default branch.
  push:
    branches: ['**']
  pull_request:
    paths:
      - ".github/workflows/setup-app.yml"
      - "installer/**"
      - "infamous-recomp/**"
      - "ps3recomp/**"
      - "sdl3/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache-workspaces: installer

      - name: Check formatting
        run: cargo fmt --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rust regressions
        run: cargo test --locked

      - name: Native regressions and regional synchronization
        shell: pwsh
        run: |
          if (-not (Get-Command cl -ErrorAction SilentlyContinue) -or -not (Get-Command clang -ErrorAction SilentlyContinue)) { throw 'Native tests require cl and clang' }
          if (-not (Test-Path ../sdl3/lib/x64/SDL3.dll)) { throw 'SDL3 runtime missing' }
          python regions/BCUS98119/tools/check_sync.py ..
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/validation -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cargo build --release --locked

      - name: Package standalone Setup
        working-directory: .
        shell: pwsh
        run: |
          installer/target/release/infamous-installer.exe package --root . --out "dist/inFamous Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test packaged Python without system Python on PATH
        shell: pwsh
        run: |
          $env:INFAMOUS_TEST_SETUP = (Resolve-Path '../dist/inFamous Setup.exe').Path
          cargo test --release --locked --test packaged_python -- --ignored

      - uses: actions/upload-artifact@v4
        with:
          name: inFamous-Setup
          path: dist/inFamous Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: infamous-installer
          path: |
            installer/target/release/infamous-installer.exe
            installer/target/release/infamous-setup.exe
            installer/target/release/infamous-launch.exe
          if-no-files-found: error

  publish-updater:
    name: Publish updater binaries
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: infamous-installer
          path: ${{ runner.temp }}/updater-binaries

      - name: Publish tested installer and launcher
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          artifact="$RUNNER_TEMP/updater-binaries"
          test -s "$artifact/infamous-installer.exe"
          test -s "$artifact/infamous-launch.exe"
          cp "$artifact/infamous-installer.exe" "$artifact/infamous-launch.exe" installer/bin/
          git add -- installer/bin/infamous-installer.exe installer/bin/infamous-launch.exe
          if git diff --cached --quiet; then
            echo 'Updater binaries are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh updater binaries from Setup app build'

          # Compare with the current tip, then use a normal push to guard against a race.
          branch_tip() {
            git ls-remote --exit-code origin "$TARGET_REF" | cut -f1
          }
          tip=$(branch_tip)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo 'The default branch moved after this build. Skipping publication.'
            exit 0
          fi
          if git push origin "HEAD:$TARGET_REF"; then
            exit 0
          fi

          tip=$(branch_tip)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo 'Another push moved the default branch. Skipping publication.'
            exit 0
          fi
          exit 1
